name: Setup Node and install dependencies
description: >
  Installs dependencies with npm ci, then verifies the resulting tree.
  npm 10.8.x can crash on exit ("Exit handler never called", npm/cli#7657)
  while still reporting success, which leaves node_modules half-populated and
  surfaces much later as a confusing "command not found" during the build.
  Verifying and retrying here keeps that failure local and self-healing.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # A lockfile written behind a private mirror pins tarball hosts the runner
    # cannot reach, and npm burns ~8 minutes per attempt before giving up. Fail
    # here with the offending entries instead.
    - name: Check the lockfile only references the public registry
      shell: bash
      run: |
        node -e '
          const lock = require("./package-lock.json");
          const offenders = Object.entries(lock.packages || {})
            .filter(([, meta]) => meta.resolved)
            .filter(([, meta]) => !meta.resolved.startsWith("https://registry.npmjs.org/"))
            .map(([name, meta]) => `  ${name} -> ${meta.resolved}`);
          if (offenders.length) {
            console.error(`::error::package-lock.json resolves ${offenders.length} package(s) outside registry.npmjs.org:`);
            console.error(offenders.join("\n"));
            console.error("Regenerate it with: npm install --registry=https://registry.npmjs.org");
            process.exit(1);
          }
          console.log("Lockfile references only the public registry.");
        '

    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          npm ci || echo "::warning::npm ci exited non-zero (attempt ${attempt})"

          # Exits non-zero when any package in the lockfile is missing from the
          # tree, which is exactly what the npm exit-handler crash leaves behind.
          if npm ls --depth=0 >/dev/null 2>&1; then
            echo "Dependency tree verified on attempt ${attempt}."
            exit 0
          fi

          echo "::warning::node_modules is incomplete after attempt ${attempt}; retrying."
          rm -rf node_modules
          sleep 5
        done

        echo "::error::npm ci could not produce a complete dependency tree after 3 attempts."
        exit 1
