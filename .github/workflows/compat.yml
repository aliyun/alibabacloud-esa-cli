name: CLI Behaviour Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-and-install
      - run: npm run build
      - name: Run offline contract tests
        run: npx vitest run --config vitest.compat.config.ts --reporter=default --reporter=json --outputFile=reports/contract.json
      - name: Reject skipped or missing contract tests
        run: node scripts/release/check-test-report.mjs reports/contract.json 155
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-report
          path: reports/contract.json
          if-no-files-found: error

  e2e:
    name: Offline E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-and-install
      - run: npm run build
      - name: Run offline E2E with local API fixtures
        run: npx vitest run --config vitest.e2e.v1.config.ts --reporter=default --reporter=json --outputFile=reports/e2e.json
      - name: Reject skipped or missing E2E tests
        run: node scripts/release/check-test-report.mjs reports/e2e.json 7
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: reports/e2e.json
          if-no-files-found: error

  behaviour-gate:
    name: Behaviour Gate
    if: always()
    needs: [contract, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/release/check-jobs.mjs contract e2e
